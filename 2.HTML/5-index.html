<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8"/>
	<title>株式会社アールピーシー</title>
	<!-- ①タブ名は『株式会社アールピーシー』としてください。 -->
</head>
<body>
	<h1 id="top">シンプルなサンプルページ</h1>
	<p>よく使うHTMLタグだけで作った、とてもシンプルな画面です。</p>
	<h2>メニュー</h2>
		<ul>
			<li><a href="#this_page">このページについて</a></li>
			<li><a href="#notifications">お知らせ</a></li>
			<li><a href="#contact">お問い合わせ</a></li>
			<!-- ③メニュー内にある各リンクをクリックすると、それぞれの見出しの位置までジャンプするようにしてください。 -->
		</ul>
	<h2 id="this_page">このページについて</h2>
	<a href="https://www.rpc-ltd.co.jp/" target="_blank"/>
		<img src="https://portal.rpc-ltd.jp/technical-leading/public/forgeon/assets/language_practical/logo.png">
		<!-- ②画面中央に表示している画像は「https://portal.rpc-ltd.jp/technical-leading/public/forgeon/assets/language_practical/logo.png」から取得してください。 -->
		<!-- ④このページについて内にある画像をクリックすると、別タブでRPC株式会社のホームページを表示させてください。 -->
	</a>
	
	<h2 id="notifications">お知らせ</h2>
		<ul>
			<li>2025-11-01 サンプルページを公開しました。</li>
			<li>2025-11-10 HTMLタグの解説を追加しました。</li>
			<li>2025-11-15 お問い合わせフォームを追加しました。</li>
		</ul>
		<!-- ⑤お知らせ内の要素はul、liで構成してください -->
	<h2>簡単な表</h2>
		<table border="1">
			<tr>
				<th>項目</th>
				<th>内容</th>
			</tr>
			<tr>
				<td>サイト名</td>
				<td>シンプルHTMLサンプル</td>
			</tr>
			<tr>
				<td>目的</td>
				<td>よく使うタグの確認</td>
			</tr>
		</table>
	<h2 id="contact">お問い合わせ</h2>
		<form>
			<div>お名前：<input type="text" name="name"/></div>
			<div>お問い合わせ内容：</div>
			<div>
				<textarea name="free" rows="5" cols="50"></textarea>
			</div>
			<div>
				<input type="submit"/>
			</div>
			<!-- ⑥お問い合わせ内にある入力項目を入力後、送信ボタンを押下するとURLに項目名と入力値が反映されるようにしてください。 -->
		</form>
	<p><a href="#top">TOPへ</a></p>
	<!-- ⑦TOPへのリンクをクリックすると、一番上までジャンプするようにしてください。 -->
</body>
</html>
